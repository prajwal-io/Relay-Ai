appId: ai.relay.desktop
productName: Relay AI
copyright: Copyright © 2026 Relay AI
protocols:
  - name: Relay AI sign-in
    schemes: [relay-ai]
directories:
  app: package-stage
  output: release
asar: true
asarUnpack:
  - "api/*.cjs"
  - "mcp/index.cjs"
electronVersion: 45.3.2
files:
  - "**/*"
win:
  icon: assets/relay.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Relay-AI-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.developer-tools
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: Relay AI sign-in
        CFBundleURLSchemes: [relay-ai]
  hardenedRuntime: true
  artifactName: Relay-AI-${version}-${arch}.${ext}
dmg:
  sign: false
